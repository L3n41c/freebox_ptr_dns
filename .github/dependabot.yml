version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Go dependency updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
